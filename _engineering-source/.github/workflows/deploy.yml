name: Build and deploy portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Resolve public URL
        id: site
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          CONFIGURED_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -n "$CONFIGURED_URL" ]; then
            echo "url=$CONFIGURED_URL" >> "$GITHUB_OUTPUT"
          elif [ "${REPOSITORY,,}" = "${OWNER,,}/${OWNER,,}.github.io" ]; then
            echo "url=https://${OWNER,,}.github.io/" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://${OWNER,,}.github.io/${REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"
          fi
      - name: Type-check and build static pages
        run: npm run build
        env:
          SITE_URL: ${{ steps.site.outputs.url }}
      - name: Verify generated pages and local links
        run: npm run verify
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload static site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
